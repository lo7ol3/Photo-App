plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        implementation 'org.openjfx:javafx-media:17'
        implementation 'org.openjfx:javafx-controls:17'
        implementation 'org.openjfx:javafx-fxml:17'
        implementation 'org.openjfx:javafx-swing:17'
    }
}

javafx {
    version = "17.0.1"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ]
}

application {
    mainClass = 'mm.prog.project.MainApp'
    
    // This passes the path to the JVM explicitly
    applicationDefaultJvmArgs = [
        "-Djava.library.path=" + project.rootProject.projectDir.path + "/opencv_native",
        "--enable-native-access=ALL-UNNAMED"
    ]
}